name: buddybird-app preview

on:
  pull_request:
    paths:
      - buddybird-app/**
      - .github/workflows/buddybird-app-preview.yml
      - .github/workflows/_pulumi-preview.yml

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: pulumi-buddybird-app
  cancel-in-progress: false

jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        stack: [dev, prod]
    uses: ./.github/workflows/_pulumi-preview.yml
    with:
      work-dir: buddybird-app
      stack-name: organization/buddybird-app/${{ matrix.stack }}
      iam-role-suffix: preview
