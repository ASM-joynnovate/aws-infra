name: lint

on:
  pull_request:
    paths:
      - "**/*.py"
      - ruff.toml
      - .github/workflows/lint.yml

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          args: "format --check --diff"

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          args: "check"
