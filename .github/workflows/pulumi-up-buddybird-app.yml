name: pulumi up buddybird-app

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pulumi-buddybird-app-prod
  cancel-in-progress: false

jobs:
  up:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::198252712951:role/jn-ci-pulumi
          aws-region: ap-northeast-2

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          working-directory: buddybird-app
          enable-cache: true

      - uses: pulumi/actions@v7
        with:
          command: up
          stack-name: organization/buddybird-app/prod
          work-dir: buddybird-app
          refresh: true
